# nginx as a caching reverse proxy.
#
# This exists because the brief says reads vastly outnumber writes. A GET that
# nginx answers from its own cache never reaches Node and never touches Postgres,
# so the expensive part of the system only sees the first request in each cache
# window. That is the single highest-leverage thing in front of a read-heavy API.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  access_log  /var/log/nginx/access.log;
  sendfile    on;
  keepalive_timeout 65;

  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 512;

  # 10m of keys in shared memory, 100m of bodies on disk, dropped after an hour
  # idle. `use_temp_path=off` avoids writing the response twice.
  proxy_cache_path /var/cache/nginx/catalog
                   levels=1:2
                   keys_zone=catalog:10m
                   max_size=100m
                   inactive=60m
                   use_temp_path=off;

  upstream api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health and readiness are proxied explicitly and never cached. A cached
    # readiness probe is worse than none: it reports the state of a process that
    # may have died since.
    location = /health {
      proxy_pass http://api;
      proxy_cache off;
      add_header X-Cache-Status "BYPASS" always;
    }

    location = /ready {
      proxy_pass http://api;
      proxy_cache off;
      add_header X-Cache-Status "BYPASS" always;
    }

    location /api/ {
      proxy_pass http://api;

      proxy_cache catalog;

      # The query string is part of the key, so ?category=Running&minPrice=... is
      # cached separately from every other filter combination.
      proxy_cache_key "$request_method$scheme$host$request_uri";

      # Only GET and HEAD are cacheable. nginx will not cache a POST or PATCH.
      proxy_cache_methods GET HEAD;

      # Honour what the application already decided in Cache-Control rather than
      # inventing a second, conflicting TTL here.
      proxy_cache_valid 200 301 302 60s;
      proxy_cache_valid 404 10s;

      # One request per key repopulates the cache; the rest wait for it instead of
      # all stampeding the origin when an entry expires.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;

      # Keep serving the stale copy while refreshing in the background, and keep
      # serving it if the origin is down. Availability over freshness for a
      # product catalog — a 60-second-old price beats a 502.
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;

      # Lets a client force a fresh read, which makes debugging a cached response
      # possible without flushing the whole cache.
      proxy_cache_bypass $http_cache_control;

      # HIT / MISS / STALE, visible in the response. Without this you are guessing
      # about whether the cache is doing anything.
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      return 404 '{"error":{"code":"NOT_FOUND","message":"No route matches this path"}}';
    }
  }
}
